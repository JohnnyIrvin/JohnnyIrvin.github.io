# name = "Medium"
# icon = "fa-brands fa-medium fa-2x"
# weight = 4
# url = "https://medium.com/@johndoe"

[[params.social]]
name = "RSS"
icon = "fa-solid fa-rss fa-2x"
weight = 5
url = "https://www.johnathanirvin.com/index.xml"
rel = "alternate"
type = "application/rss+xml"

[languages.en]
languageName = ":uk:"

[[languages.en.menu.main]]
name = "Resume"
weight = 1
url = "resume/"


baseURL = "https://www.johnathanirvin.com"
title = "Johnathan Irvin"
theme = "hugo-coder"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true

[pagination]
pagerSize = 6

[services]
[services.disqus]
# Enable Disqus comments
# shortname = "yourdiscussshortname"

[markup]
[markup.highlight]
noClasses = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params]
author = "Johnathan Irvin"
# license = '<a rel="license" href="http://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA-4.0</a>'
description = "Security Researcher & Software Engineering Leader specializing in vulnerability research and application security"
keywords = "security researcher,vulnerability research,software engineering,application security,exploit development,cybersecurity"
info = ["Security Researcher", "Software Engineer"]
avatarURL = "images/avatar.png"
# gravatar = "me@3xpl0173d.dev"
dateFormat = "January 2, 2006"
since = 2020

# Git Commit in Footer, uncomment the line below to enable it
# commit = "https://github.com/luizdepra/hugo-coder/tree/"

# Right To Left, shift content direction for languages such as Arabic
rtl = false

# Specify light/dark colorscheme
# Supported values:
# "auto" (use preference set by browser)
# "dark" (dark background, light foreground)
# "light" (light background, dark foreground) (default)
colorScheme = "auto"

# Hide the toggle button, along with the associated vertical divider
hideColorSchemeToggle = true

# Series see also post count
maxSeeAlsoItems = 5

# Custom CSS
customCSS = ["css/custom.css"]

# Custom SCSS, file path is relative to Hugo's asset folder (default: {your project root}/assets)
customSCSS = []

# Custom JS
customJS = []

# Custom remote JS files
customRemoteJS = []

# If you want to use Google Tag Manager(https://analytics.google.com/) for analytics, add this section
[params.googleTagManager]
id = "G-WVDPVNZSYE"

# If you want to implement a Content-Security-Policy, add this section

<section class="container page">
  <article>
    <header>
      <h1 class="title">
        <a class="title-link" href="{{ .Permalink | safeURL }}">
          {{ .Title }}
        </a>
      </h1>
    </header>

    {{ if .Params.toc }}
      <nav class="page-toc" aria-label="Table of contents">
        <h2>Table of Contents</h2>
        {{ .TableOfContents }}
      </nav>
    {{ end }}

    {{ .Content }}
  </article>
</section>

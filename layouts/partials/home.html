<section class="container">
  <div class="centered">
    <div class="about">
      {{ partialCached "home/avatar.html" . }}
      {{ partialCached "home/author.html" . }}
      {{ partialCached "home/social.html" . }}
    </div>

    {{ partialCached "home/extensions.html" . }}
  </div>

  {{ with .Site.GetPage "/" }}
    {{ if .Content }}
      <article class="markdown">
        {{ .Content }}
      </article>
    {{ end }}
  {{ end }}
</section>
